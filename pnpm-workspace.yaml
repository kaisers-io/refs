packages:
  - packages/*

# Exact versions on `pnpm add`, and an install that fails on a Node outside engines.node.
saveExact: true
engineStrict: true

# Refuse a dependency version published with weaker trust evidence (trusted publisher,
# provenance) than an earlier release of the same package. That does not prove a compromise,
# but it is what a publish with a leaked token would look like, so it waits for review.
# The lockfile is re-checked on every install because trustLockfile stays at its default false.
# Add a reviewed exception to trustPolicyExclude as `name@version` (a bare name waives every
# version); avoid trustPolicyIgnoreAfter, which waives the check by age rather than by review.
# packages/cli/test/trust-policy-config.test.ts fails if these settings are weakened.
# https://pnpm.io/settings/dependency-resolution#trustpolicy
trustPolicy: no-downgrade

# No dependency of this workspace needs a build script (native tools ship as prebuilt
# optional packages). With strictDepBuilds, an install fails when a dependency update
# brings one, so it is reviewed rather than run or silently skipped. CI installs do not
# pass --ignore-scripts for that reason: the flag would hide this error. A script that is
# not needed is accepted by review as an `allowBuilds` entry `name: false`; an entry set to
# true would run it. packages/cli/test/trust-policy-config.test.ts fails if either is loosened.
# https://pnpm.io/settings/build
strictDepBuilds: true
