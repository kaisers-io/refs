schema_version: '1.1'
name: discovery-incomplete
description: >-
  The scan for unregistered packages cannot finish because a member manifest is unreadable. The
  answer must not turn that into "none": it either says it cannot tell or finds the unregistered
  package itself, and either way it names the file that stopped the scan, since fixing that file
  is what lets refs check again.
plugins: ['../../skills/refs']
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  append_system_prompt: >-
    Only your last message is read. Finish any background work before you write it, and make it
    the complete answer.
  allowed_tools: [Bash, Read, Glob, Grep]
  prompt: >-
    /refs Does local/fixtures/toolkit declare any workspace packages I have not registered? Start
    your reply with a line that is exactly YES, NO, or CANNOT TELL, then explain.
graders:
  # Compact JSON in the transcript is refs' own output, not a mention in the docs.
  - name: ran-doctor
    type: regex
    pattern: '\\"name\\":\\"config-drift\\"'
    target: trace
  - name: verdict-is-not-a-false-no
    type: regex
    pattern: '^\W*(CANNOT TELL|YES[\s\S]*(@toolkit/cache|packages/cache))'
  - name: names-what-stopped-the-scan
    type: regex
    pattern: 'packages/broken'
