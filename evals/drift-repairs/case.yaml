schema_version: '1.1'
name: drift-repairs
description: >-
  After a sync, one registered package is missing and another relocated. They need different
  repairs: unregistering a package that merely moved loses it. Report-only, so the grade is the
  diagnosis and the commands, not their execution.
plugins: ['../../skills/refs']
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  append_system_prompt: >-
    Only your last message is read. Finish any background work before you write it, and make it
    the complete answer.
  allowed_tools: [Bash, Read, Glob, Grep, Write]
  # The commands are graded from FILES, as in quoted-repair: prose cannot tell a command from one
  # inside a comment or a warning, and an answer that quotes a wrong spelling to warn against it is
  # a better answer, not a worse one. The explanation stays in the reply.
  prompt: >-
    /refs Sync my refs. Explain any drift and give me the exact repair commands. Do not apply
    repairs or change the configuration. Write each repair command, that one command on one line
    and nothing else, to its own file: removal-command.txt for a package to unregister and
    relocation-command.txt for a package whose path changed.
graders:
  # Compact JSON in the transcript is refs' own output, not a mention in the docs.
  - name: synced
    type: regex
    pattern: '\\"structure\\":\{'
    target: trace
  # Exact argv grammars, generated by scripts/skill-evals/command-grammar.mjs (run it with --write
  # after changing one; CI runs --check). The ref is the first positional and, for the move, the
  # `path <value>` pair follows it; known options may sit anywhere, each at most once; values are
  # literal shell words; nothing may follow the command. So the ref after the field pair (refs reads
  # `path` as the ref and exits 4), a wrong ref or package, an extra argument, a second `--package`
  # (the last one wins), a comment or a second command all fail.
  - name: removal-for-the-missing-package
    type: regex
    target: { source: file, path: removal-command.txt }
    pattern: '^\s*refs[ \t]+edit(?![\s\S]*[ \t]+--package(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--package(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--remove(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--remove(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--json(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--json(?==|[ \t\r\n]|$))(?=[\s\S]*[ \t]+--package(?:=|[ \t]+)(?:''@toolkit/slugify''|"@toolkit/slugify"|@toolkit/slugify)(?=[ \t\r\n]|$))(?=[\s\S]*[ \t]+--remove(?=[ \t\r\n]|$))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/slugify''|"@toolkit/slugify"|@toolkit/slugify)|--remove|--json)(?=[ \t\r\n]|$))*[ \t]+(?:''local/fixtures/toolkit''|"local/fixtures/toolkit"|local/fixtures/toolkit|''toolkit''|"toolkit"|toolkit)(?=[ \t\r\n]|$)(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/slugify''|"@toolkit/slugify"|@toolkit/slugify)|--remove|--json)(?=[ \t\r\n]|$))*[ \t]*(?:\r?\n[ \t]*)*(?![\s\S])'
  - name: path-edit-for-the-relocated-package
    type: regex
    target: { source: file, path: relocation-command.txt }
    pattern: '^\s*refs[ \t]+edit(?![\s\S]*[ \t]+--package(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--package(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--json(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--json(?==|[ \t\r\n]|$))(?=[\s\S]*[ \t]+--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)(?=[ \t\r\n]|$))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json)(?=[ \t\r\n]|$))*[ \t]+(?:''local/fixtures/toolkit''|"local/fixtures/toolkit"|local/fixtures/toolkit|''toolkit''|"toolkit"|toolkit)(?=[ \t\r\n]|$)(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json)(?=[ \t\r\n]|$))*[ \t]+(?:''path''|"path"|path)(?=[ \t\r\n]|$)(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json)(?=[ \t\r\n]|$))*[ \t]+(?:''packages/retry-policy''|"packages/retry-policy"|packages/retry-policy)(?=[ \t\r\n]|$)(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json)(?=[ \t\r\n]|$))*[ \t]*(?:\r?\n[ \t]*)*(?![\s\S])'
  - name: relocated-package-not-removed
    type: regex
    pattern: 'refs edit(?=[^\n;&|]*@toolkit/retry["'']?(?:\s|$|`))(?=[^\n;&|]*\s--remove(?:\s|$|`))'
    match: not_contains
  - name: missing-package-still-registered
    type: regex
    pattern: '\."@toolkit/slugify"\]\ndescription = "[^"]*"\npath = "packages/slugify"\n'
    target: { source: file, path: .refs-home/refs/config.toml }
  - name: relocated-package-path-unchanged
    type: regex
    pattern: '\."@toolkit/retry"\]\ndescription = "[^"]*"\npath = "packages/retry"\n'
    target: { source: file, path: .refs-home/refs/config.toml }
