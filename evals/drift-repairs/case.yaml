schema_version: '1.1'
name: drift-repairs
description: >-
  After a sync, one registered package is missing and another relocated. They need different repairs: unregistering a package that merely moved loses it. Report-only, so the grade is the diagnosis and the commands, not their execution.
plugins: ['../../skills/refs']
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  append_system_prompt: >-
    Your final message and requested command files are graded. Finish any background work before
    replying, and make the final message the complete explanation.
  allowed_tools: [Bash, Read, Glob, Grep, Write]
  prompt: >-
    /refs Sync my refs. Explain any drift and give me the exact repair commands. Do not apply repairs or change the configuration. Write each repair as one command on one line, with no comments or prose, to removal-command.txt (missing package) and relocation-command.txt (relocated package).
graders:
  # Compact JSON in the transcript is refs' own output, not a mention in the docs.
  - name: synced
    type: regex
    pattern: '\\"structure\\":\{'
    target: trace
  # Exact command-file grammars generated by scripts/skill-evals/command-patterns.mjs.
  # The same regex runs in Claude and Codex; answer prose is never treated as shell code.
  - name: removal-for-the-missing-package
    type: regex
    pattern: '^[ \t]*refs[ \t]+edit(?![\s\S]*[ \t]+--package(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--package(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--remove(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--remove(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--json(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--json(?==|[ \t\r\n]|$))(?=[\s\S]*[ \t]+--package(?:=|[ \t]+)(?:''@toolkit/slugify''|"@toolkit/slugify"|@toolkit/slugify)(?:[ \t\r\n]|$))(?=[\s\S]*[ \t]+--remove(?:[ \t\r\n]|$))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/slugify''|"@toolkit/slugify"|@toolkit/slugify)|--remove|--json))*[ \t]+(?:(?:''local/fixtures/toolkit''|"local/fixtures/toolkit"|local/fixtures/toolkit)|(?:''toolkit''|"toolkit"|toolkit))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/slugify''|"@toolkit/slugify"|@toolkit/slugify)|--remove|--json))*[ \t]*(?:\r?\n[ \t]*)*$(?![\s\S])'
    target: { source: file, path: removal-command.txt }
  - name: path-edit-for-the-relocated-package
    type: regex
    pattern: '^[ \t]*refs[ \t]+edit(?![\s\S]*[ \t]+--package(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--package(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--json(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--json(?==|[ \t\r\n]|$))(?=[\s\S]*[ \t]+--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)(?:[ \t\r\n]|$))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json))*[ \t]+(?:(?:''local/fixtures/toolkit''|"local/fixtures/toolkit"|local/fixtures/toolkit)|(?:''toolkit''|"toolkit"|toolkit))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json))*[ \t]+(?:(?:''path''|"path"|path))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json))*[ \t]+(?:(?:''packages/retry-policy''|"packages/retry-policy"|packages/retry-policy))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/retry''|"@toolkit/retry"|@toolkit/retry)|--json))*[ \t]*(?:\r?\n[ \t]*)*$(?![\s\S])'
    target: { source: file, path: relocation-command.txt }
  - name: relocated-package-not-removed
    type: regex
    pattern: 'refs edit(?=[^\n;&|]*@toolkit/retry["'']?(?:\s|$|`))(?=[^\n;&|]*\s--remove(?:\s|$|`))'
    match: not_contains
  - name: missing-package-still-registered
    type: regex
    pattern: '\."@toolkit/slugify"\]\ndescription = "[^"]*"\npath = "packages/slugify"\n'
    target: { source: file, path: .refs-home/refs/config.toml }
  - name: relocated-package-path-unchanged
    type: regex
    pattern: '\."@toolkit/retry"\]\ndescription = "[^"]*"\npath = "packages/retry"\n'
    target: { source: file, path: .refs-home/refs/config.toml }
