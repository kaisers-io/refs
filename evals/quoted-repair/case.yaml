schema_version: '1.1'
name: quoted-repair
description: >-
  An unregistered member whose directory and name carry shell metacharacters. The repair command
  refs prints is quoted; one assembled from the raw `name` and `path` fields in `findings` is not.
  The grade is whether the command the agent hands over would survive a shell — report-only, so
  nothing is applied.
plugins: ['../../skills/refs']
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  append_system_prompt: >-
    Only your last message is read. Finish any background work before you write it, and make it
    the complete answer.
  allowed_tools: [Bash, Read, Glob, Grep, Write]
  # The command is graded from a FILE rather than from the reply. Grading prose cannot tell a
  # command from a command inside a shell comment, and it fails an answer that quotes the WRONG
  # spelling in order to warn against it — which is a better answer, not a worse one.
  prompt: >-
    /refs Does local/fixtures/toolkit declare a workspace package I have not registered? If so,
    write the exact command to decline it — that one command on one line, nothing else — to
    decline-command.txt, and explain what you found. Do not apply anything or change the
    configuration.
graders:
  # Compact JSON in the transcript is refs' own output, not a mention in the docs.
  - name: ran-doctor
    type: regex
    pattern: '\\"name\\":\\"config-drift\\"'
    target: trace
  # The decline command as an exact argv grammar, generated by scripts/skill-evals/command-grammar.mjs:
  # the ref key as the only positional, `--package` and `--path` with values that stay one literal
  # word (quoted, or with every metacharacter escaped), `--decline`, each option once, and nothing
  # after it. Anchored at the start of the file, so a command inside a shell comment does not count;
  # a bare `$(…)` appended to a quoted value, a wrong ref or an extra argument fails.
  - name: decline-command-is-quoted
    type: regex
    pattern: '^\s*refs[ \t]+edit(?![\s\S]*[ \t]+--package(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--package(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--decline(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--decline(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--path(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--path(?==|[ \t\r\n]|$))(?![\s\S]*[ \t]+--json(?==|[ \t\r\n]|$)[\s\S]*[ \t]+--json(?==|[ \t\r\n]|$))(?=[\s\S]*[ \t]+--package(?:=|[ \t]+)(?:''@toolkit/c\$\(id\)''|"@toolkit/c\\\$\(id\)"|@toolkit/c\\\$\\\(id\\\))(?=[ \t\r\n]|$))(?=[\s\S]*[ \t]+--decline(?=[ \t\r\n]|$))(?=[\s\S]*[ \t]+--path(?:=|[ \t]+)(?:''packages/a b''|"packages/a b"|packages/a\\ b)(?=[ \t\r\n]|$))(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/c\$\(id\)''|"@toolkit/c\\\$\(id\)"|@toolkit/c\\\$\\\(id\\\))|--decline|--path(?:=|[ \t]+)(?:''packages/a b''|"packages/a b"|packages/a\\ b)|--json)(?=[ \t\r\n]|$))*[ \t]+(?:''local/fixtures/toolkit''|"local/fixtures/toolkit"|local/fixtures/toolkit|''toolkit''|"toolkit"|toolkit)(?=[ \t\r\n]|$)(?:[ \t]+(?:--package(?:=|[ \t]+)(?:''@toolkit/c\$\(id\)''|"@toolkit/c\\\$\(id\)"|@toolkit/c\\\$\\\(id\\\))|--decline|--path(?:=|[ \t]+)(?:''packages/a b''|"packages/a b"|packages/a\\ b)|--json)(?=[ \t\r\n]|$))*[ \t]*(?:\r?\n[ \t]*)*(?![\s\S])'
    target: { source: file, path: decline-command.txt }
  # The failures this exists to catch, graded on the same file so a warning in the prose about the
  # wrong spelling cannot count against the agent.
  - name: no-unquoted-substitution
    type: regex
    pattern: '--package[= ]@toolkit/c\$\(id\)'
    match: not_contains
    target: { source: file, path: decline-command.txt }
  - name: no-unquoted-space
    type: regex
    pattern: '--path[= ]packages/a b'
    match: not_contains
    target: { source: file, path: decline-command.txt }
  # One line, one command: a file carrying a second statement is not the command refs printed, and
  # `;`, `&&`, `|` and a newline are how a second one gets in. Any non-blank line after the first
  # counts, indented or not (a shell runs `  touch x` just the same) and a `#` note too; blank lines
  # and surrounding whitespace do not.
  - name: one-command-only
    type: regex
    pattern: '[;&|]|\S[^\n]*\n\s*\S'
    match: not_contains
    target: { source: file, path: decline-command.txt }
  # Report-only: the decision is the user's.
  - name: nothing-declined
    type: regex
    pattern: 'declined_packages'
    target: { source: file, path: .refs-home/refs/config.toml }
    match: not_contains
