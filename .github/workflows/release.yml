name: release
on:
  push:
    tags: ['v*']
# No pull_request/workflow_dispatch trigger on this file — the only way to reach the `publish`
# job (which mints an npm OIDC token) is a tag push, and only after the `verify` job passes.
permissions:
  contents: read
jobs:
  # Gate: re-runs the full CI check suite against the exact tagged commit, plus release-only
  # guards (tag/version match, branch containment, tarball content allowlist) and a smoke test
  # of the packed tarball. Holds only read permissions — no publish credentials live here. This
  # is also where the CLI bundle is built: `dist/refs.mjs` is gitignored build output (not
  # committed; `bin/refs.mjs` is the committed stub), so this unprivileged job builds it, proves
  # the build is reproducible, guards its shape, and hands it to `publish` as a workflow artifact
  # — see the `publish` job comment below for why that handoff is what keeps `id-token: write` safe.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No `cache: pnpm` in this workflow (unlike ci.yml): a poisoned or stale restore-key cache
      # is a plausible supply-chain vector for the one workflow with publish reach, so the
      # release pipeline always installs clean.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Guard — tag matches packages/cli/package.json version
        # `github.ref_name` is attacker-controlled text once the repo is public (anyone who can
        # push a tag controls it) — it goes into env, never directly into the script body, so it
        # can't be spliced into the shell command.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG (version $VERSION) does not match packages/cli/package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "tag $TAG matches package version $PKG_VERSION"
      - name: Guard — packaged CHANGELOG.md matches the repository one
        # The tarball ships packages/cli/CHANGELOG.md so npm users can see changes without
        # leaving the package page; this fails the release when a bump edits only the root copy.
        run: cmp CHANGELOG.md packages/cli/CHANGELOG.md
      - name: Guard — CHANGELOG.md has a heading for the released version
        # `cmp` above proves the two copies match, not that either describes this release. Since the
        # version bump moved into the feature branch (87c10d0), the entry can still sit under
        # `## [Unreleased]` at tag time — and that publishes cleanly, leaving a 0.6.0 tarball whose
        # packaged changelog (the one npm shows on the package page) shows 0.5.1
        # as the newest release. Checked on the root copy alone because `cmp` already tied them.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! grep -qF "## [$VERSION] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - <date>' heading — the entry for this release is probably still under '## [Unreleased]'" >&2
            exit 1
          fi
          echo "CHANGELOG.md has a heading for $VERSION"
      - name: Guard — tagged commit is reachable from origin/main
        # A tag pushed from a random branch/fork must not be able to publish. `GITHUB_SHA` is
        # the runner-assigned commit SHA (not attacker-suppliable text like ref_name), so it's
        # safe to reference directly.
        run: |
          set -euo pipefail
          # No --depth here: a shallow fetch would write .git/shallow and narrow the ancestor
          # check to "tag is the exact current tip" — tagging an older main commit must stay legal.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not reachable from origin/main — refusing to publish from a stray branch" >&2
            exit 1
          fi
      - name: Guard — every version site declares this CLI version
        # Which two files carry the version, why they must agree, and why one run reports every
        # disagreement: see the header of scripts/versions.mjs, which replaced the two inline guards
        # that used to live here. `--check` also runs on every PR (ci.yml), so by tag time this is a
        # re-assertion rather than a first look. Placed after the origin/main containment guard and
        # before `pnpm install`: it needs no dependencies, and running repo-controlled code only
        # once the commit is known to be reachable from main keeps that exposure as late as it can be.
        run: node scripts/versions.mjs --check
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm build
      - run: bash scripts/check-bundle-determinism.sh
      - name: Guard — pack the tarball, verify its contents, smoke-test the install
        run: |
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          PACK_JSON="$(npm pack ./packages/cli --json --pack-destination "$PACK_DIR")"
          # Regression net for "no source code in the tarball": the tarball must contain EXACTLY
          # this file set — extras (leaked source) and missing files (dropped LICENSE) both fail.
          # Shipping a new file (e.g. a package README) requires deliberately updating this set.
          node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const expected = ["CHANGELOG.md", "LICENSE", "README.md", "bin/refs.mjs", "dist/refs.mjs", "package.json"];
            const actual = pack.files.map((f) => f.path).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              console.error("tarball shape mismatch — expected exactly:", expected.join(", "));
              console.error("actual:", actual.join(", "));
              process.exit(1);
            }
            console.log("tarball contents OK:", actual.join(", "));
          ' "$PACK_JSON"
          TARBALL="$PACK_DIR/$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$PACK_JSON")"
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" "$TARBALL"
          export PATH="$PREFIX/bin:$PATH"
          REFS_HOME="$(mktemp -d)"
          export REFS_HOME
          refs --version
          refs init
      - name: Upload the built CLI bundle for the publish job
        # This is the ONLY channel that gets `dist/refs.mjs` into `publish`: the artifact built,
        # determinism-checked, and shape-guarded above by this unprivileged (no id-token) job.
        # Short retention — it only needs to survive until `publish` downloads it moments later.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-bundle
          path: packages/cli/dist/refs.mjs
          if-no-files-found: error
          retention-days: 1
  # Publish: the only job with OIDC (`id-token: write`) reach. Runs only after `verify` passes,
  # against the same tagged commit. Deliberately minimal: the published bundle is the artifact
  # `verify` built, determinism-checked, and shape-guarded — downloaded here, not rebuilt — so no
  # dependency install and no build runs while the OIDC permission is in scope. Any step in a job
  # can mint the job's OIDC identity, so repo-controlled build tooling must never execute here.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard — a provenance attestation needs a public repository
        # The `--provenance` flag below hard-fails on the prerequisites npm checks (`id-token`,
        # the CI provider, npm package visibility) but never on repository visibility: npm looks
        # at that only on its automatic path, which stating the flag bypasses. Were this repo
        # private again, the publish would still sign — attesting to a URL nobody can resolve
        # and writing the private repository's name into the public transparency log. Refuse
        # here instead, while nothing has left the runner.
        #
        # Written fail-closed on purpose. An `if:` condition on the payload value would skip
        # this step silently if the field were ever absent, which is the failure mode it exists
        # to prevent — so an empty value is an error too, and only a literal `false` passes.
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "${REPO_PRIVATE:-}" != "false" ]; then
            echo "::error::Repository visibility reads '${REPO_PRIVATE:-<absent>}', expected 'false'. A provenance attestation would name a repository nobody can resolve. Refusing to publish."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # Required for npm's Trusted Publishing (OIDC) exchange to target the right registry —
          # npm CLI >= 11.5.1 is required, which is what ships with the pinned Node version above
          # (verified locally: node v24.12.0 bundles npm 11.6.2).
          registry-url: 'https://registry.npmjs.org'
      - name: Download the CLI bundle built by the unprivileged verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-bundle
          path: packages/cli/dist
      - name: Guard — restore the executable bit stripped by artifact zipping
        # actions/upload-artifact zips its payload, and zip does not preserve the Unix mode bits
        # (see upstream's "Permission Loss" note) — every file lands back at plain 644. Re-apply
        # the mode tsdown set at build time and confirm it stuck before this ships as `dist/refs.mjs`.
        run: |
          set -euo pipefail
          chmod 755 packages/cli/dist/refs.mjs
          test -x packages/cli/dist/refs.mjs
      - name: Publish to npm via Trusted Publishing (OIDC)
        working-directory: packages/cli
        # No NPM_TOKEN / secrets.* anywhere: authentication is the short-lived OIDC token GitHub
        # mints from `id-token: write` above, exchanged by npm CLI for a publish token. This
        # requires a ONE-TIME manual step by the package owner: configure this repo + this exact
        # workflow file as a Trusted Publisher for `@kaisers-io/refs` on npmjs.com. Until that is
        # done, this step fails with an auth error — that failure is expected and safe (there is
        # no fallback long-lived token to leak).
        # `--ignore-scripts`: no lifecycle scripts run at publish time.
        # `--provenance`: trusted publishing attaches an attestation on its own, but its check
        # for a public repository sits behind `config.isDefault('provenance')` and fails in
        # silence — which is how 0.8.0 shipped without one while this repo was private. Stating
        # the flag skips that automatic path and hard-fails instead on the prerequisites this
        # job does control: `id-token: write`, a supported CI provider, a public npm package.
        # It does not re-check repository visibility, so read it as an assertion about this
        # job, not as a guard against the repository going private again.
        run: npm publish --ignore-scripts --provenance

  # The GitHub release entry. Separate from `publish` on purpose: creating one needs
  # `contents: write`, and the publish job is deliberately the narrowest thing in this repository —
  # it holds `id-token: write`, runs no repository-controlled code, and installs nothing. Handing it
  # write access to the repository as well would undo that. This job holds the other half instead,
  # and never sees the npm identity.
  #
  # `contents: write` is the narrowest scope GitHub offers for creating a release, not a scope
  # limited to releases: it also permits pushing to unprotected branches and creating or deleting
  # tags. That is why `--verify-tag` below is not decoration.
  #
  # `needs: publish` so a failed publish leaves no release entry announcing something that never
  # shipped. The reverse gap is the tolerable one: a published package with no release entry is
  # visible and fixable by hand, which is how v0.8.3 and v0.9.0 were created before this existed.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract this version's changelog section as the release notes
        # `verify` already proved the heading exists, so a missing section here means the two jobs
        # disagree about the tag — worth failing on rather than publishing an empty release body.
        #
        # `TAG` goes through env, never spliced into the script: once the repository is public,
        # anyone who can push a tag controls that text (same reasoning as the guards in `verify`).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { capturing = 1; next }
            capturing && /^## \[/ { exit }
            capturing { print }
          ' CHANGELOG.md > release-notes.md
          # Not `test -s`: a heading followed straight by the next one captures the blank line
          # between them, which is a nonempty file and an empty release. `verify` proves the heading
          # exists, not that anything was written under it.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::the changelog section for $VERSION is empty — nothing to put in the release" >&2
            exit 1
          fi
          echo "release notes: $(wc -l < release-notes.md) lines"
      - name: Create the release
        # Notes come from the changelog rather than `--generate-notes`: the changelog is written for
        # the people this affects, and a list of commit subjects is not.
        #
        # `--verify-tag` matters more than it looks. Without it, `gh release create` CREATES a
        # missing tag, pointing at the default branch's current head — so this sequence would
        # fabricate one: publish succeeds, this job fails, someone deletes the tag while sorting
        # that out, then re-runs the failed job. `needs` is already satisfied by the successful
        # publish in the same run, so this job would run alone and resurrect the tag on whatever
        # `main` points at by then — a commit `verify` never checked, wearing the released version's
        # name. With the flag it fails instead, which is the only acceptable outcome.
        #
        # Note on Latest: gh sends no `make_latest`, and the API defaults it to true, so whatever
        # this creates becomes Latest. Correct for a forward release; it would mislabel a backport
        # tag pushed after a higher version, which this project has never done.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
