name: audit
# Advisory scan of every package in pnpm-lock.yaml. GitHub's dependency graph stopped seeing the
# transitive packages when the lockfile became two YAML documents (pnpm 12), so Dependabot alerts no
# longer cover packages bundled into the published CLI, such as brace-expansion via minimatch. This
# workflow restores that signal with `pnpm audit`, which reads both documents, and
# scripts/audit-lockfile.mjs checks that it did.
#
# Its own workflow, not a job in ci.yml: an advisory published today would turn every open PR red
# whatever the PR changed. So a PR runs it only when it touches the files below, the ones that can
# change this result; the push to main and the weekly run catch an advisory against an unchanged
# lockfile, the weekly one on a quiet week with no PR at all. The full lockfile is audited, not
# `--prod`: zod, commander and smol-toml are devDependencies of packages/cli and still ship inside
# its bundle.
#
# Must not be a required check while it is path-filtered: a workflow skipped by `paths` reports no
# status, and a required check that never reports leaves the PR waiting forever. Making it required
# means an unfiltered trigger with a job that skips its work, but still passes, on other changes.
on:
  push: { branches: [main] }
  pull_request:
    # .npmrc names the registry `pnpm audit` queries; the test file is run below.
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - .npmrc
      - .github/workflows/audit.yml
      - scripts/audit-lockfile.mjs
      - scripts/audit-lockfile.test.mjs
  schedule:
    # Mondays, 06:17 UTC; off the hour, where scheduled runs queue.
    - cron: "17 6 * * 1"
  workflow_dispatch:
# A superseded PR run is cancelled; a push to main or a scheduled run keys on its own run id, so
# none of those is ever cancelled. The same rule as ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# Runs `pnpm install` from PR-controlled code: the token stays read-only, as in ci.yml.
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs, matching ci.yml and release.yml; see the rationale there.
      # No step needs the token after checkout; zizmor's artipacked audit flags a persisted one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      # Only for `yaml`, which the script parses the lockfile with.
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/audit-lockfile.test.mjs
      # Exit 1 advisories, 2 part of the lockfile unaudited, 3 the audit did not complete (registry
      # or network error: rerun it; it is not a clean result).
      - run: node scripts/audit-lockfile.mjs
