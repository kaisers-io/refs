name: skill-audit
# Runs the scanners that skills.sh applies to the published skill. skills.sh generates its audits
# after a skill is first installed and offers no re-scan trigger, so a finding that reaches it stays
# on a public page. This catches one before the merge instead.
#
# Path-filtered because the Snyk job uploads the skill's text to a hosted API, and Snyk asks callers
# not to scan at scale.
on:
  push:
    branches: [main]
    paths: ['skills/**', '.github/workflows/skill-audit.yml', 'package.json']
  pull_request:
    paths: ['skills/**', '.github/workflows/skill-audit.yml', 'package.json']
# Separate from ci.yml so that workflow keeps `contents: read`: the SARIF upload needs
# `security-events: write`, which has no business in a job that runs PR-controlled build and test code.
permissions:
  contents: read
jobs:
  # Apache-2.0 and credential-free, so this is the one skill check that also covers pull requests
  # from forks. Different engine from Snyk's, and different findings: injected instructions,
  # exfiltration patterns, malicious code, obfuscation.
  static:
    permissions:
      contents: read
      security-events: write
    # Pinned to the commit behind tag 2.0.13. The documented `@main` would run whatever that
    # repository publishes next.
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@433ab08f8a4eda9b2a1b5e2b4857b691162faf8f # 2.0.13
    with:
      # `skills`, not `skills/refs`: the default scan_mode is `scan-all`, which enumerates the
      # children of this path. Given a single skill's own directory it reports "No skills found to
      # scan" and exits green.
      skill_path: skills
      fail_on_severity: medium
  # The engine behind the Snyk verdict skills.sh publishes. Needs SNYK_TOKEN, and pull requests from
  # forks get no secrets, so it is skipped there and runs on the push to main. `pull_request_target`
  # would hand repository secrets to PR-controlled content.
  snyk:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      # The scanner is a Python package invoked through uvx. pipx ships on GitHub's Ubuntu images.
      - run: pipx install uv
      # `pnpm skill:audit` keeps the scanner version pin in one place and runs here what a
      # contributor runs locally. Its flags:
      #   --ci                          exit non-zero on any finding, and also when no token is
      #                                 usable, so a run that analyzed nothing fails rather than
      #                                 reporting a clean skill. Nothing is waived — the scanner's
      #                                 --ignore-issues-codes is deliberately unused.
      #   --dangerously-run-mcp-servers required by --ci unconditionally, because a CI run cannot
      #                                 answer the per-server consent prompt. It starts every stdio
      #                                 MCP server in the scanned tree, and is inert only because
      #                                 the target holds skills and no MCP config.
      # The target is `skills/` rather than `skills/refs/` because discovery is one level deep
      # (`<path>/<name>/SKILL.md`), so the parent is the narrowest path that still finds everything.
      #
      # Snyk's judges are LLM-based and not deterministic. Re-run a lone red result and reproduce it
      # with `pnpm skill:audit` before acting on it, and never edit the skill into something untrue
      # to clear one.
      #
      # SNYK_TOKEN is a personal access token and expires. An expired one fails this job the same way
      # a finding does; a log line saying to set SNYK_TOKEN means the token, not the skill.
      - run: pnpm skill:audit
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
