name: ci
on:
  push: { branches: [main] }
  pull_request:
# PR-controlled code runs in every job (install/build/test) — keep the ambient token read-only.
permissions:
  contents: read
# A newer push to a pull request makes the older run's answer moot, so that run is cancelled.
# Pushes to main get a group of their own (the run id) and are never cancelled or replaced: a
# shared group would not do, because GitHub keeps at most one run pending per group and cancels
# the one it displaces. Every commit on main keeps a complete result, which is what tells a later
# bisect where a break came in. `github.ref` (refs/pull/<n>/merge) rather than the head branch
# name, which two forks can share.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# Every checkout sets `persist-credentials: false`. No step talks to the remote after the
# checkout, and a token left on the runner is reachable by every later step that runs PR-controlled
# code (install scripts, tests). Checkout v6+ keeps it under RUNNER_TEMP instead of .git/config,
# which narrows the ways it leaks without removing it.
#
# Every job has a `timeout-minutes` several times its observed duration — the slowest, `check` on
# Windows, has taken up to about 6.5 minutes. It exists to stop a hung run in minutes rather than
# GitHub's 360-minute default, not to police speed, so a slow runner must never come near it.
#
# Every `uses:` below is pinned to a commit SHA rather than a moving tag, matching release.yml.
# A tag is a pointer its owner can move, so `@v7` is a standing agreement to run whatever that
# repository publishes next — and these actions run in the same job as PR-controlled code. The
# trailing comment is the human-readable version; Dependabot updates both together. Pinning was
# a no-op the day it landed: all three tags resolved to exactly these commits.
jobs:
  check:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Coverage thresholds (vitest.config.ts) act as a regression gate; one OS suffices — and
      # keeping the gate off Windows means a justified platform skip can never flake the ratchet.
      - run: pnpm test:coverage
        if: matrix.os == 'ubuntu-latest'
  # Proves the supported floor (package.json engines.node, see the rationale comment in
  # packages/cli/bin/refs.mjs) actually runs the SHIPPED bundle, not just that the number was
  # typed somewhere and the source tests happen to pass on it.
  #
  # Two `setup-node` calls, on purpose (the second's node-version wins for every step after it):
  # tsdown (the bundler `pnpm build` invokes) declares `engines.node: "^22.18.0 || >=24.11.0"` —
  # newer than our 24.2 floor — so it cannot itself run on the floor interpreter. That is not a
  # gap in the floor: the floor is a claim about the RUNTIME of the published bundle, and users
  # install that prebuilt bundle from npm — they never run tsdown. So this job installs and
  # builds on the development pin (node-version-file: .node-version, where tsdown is supported),
  # then switches to the floor interpreter to run `pnpm check` and — the part source-only
  # testing can't cover — a smoke test of the built packages/cli/dist/refs.mjs,
  # which also carries bundled/minified zod, commander and smol-toml. Do not collapse this back
  # into one setup-node step; that would silently drop the guarantee that the shipped artifact,
  # not just the source, runs on the floor.
  check-node-floor:
    name: check (node floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.2.0, cache: pnpm }
      - run: pnpm check
      - name: smoke test the built dist/refs.mjs on the floor interpreter
        run: |
          set -euo pipefail
          node --version
          BUNDLE="packages/cli/dist/refs.mjs"
          EXPECTED="$(node -p "require('./packages/cli/package.json').version")"
          export REFS_HOME="$(mktemp -d)"
          VERSION="$(node "$BUNDLE" --version)"
          [ "$VERSION" = "$EXPECTED" ] || {
            echo "refs --version printed '$VERSION', expected '$EXPECTED'"; exit 1;
          }
          node "$BUNDLE" init --json >/dev/null
          node "$BUNDLE" doctor --json | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const { data } = JSON.parse(raw);
              const node = data.checks.find((check) => check.name === "node");
              if (node === undefined || node.status !== "ok") {
                console.error("doctor node check did not report ok:", node);
                process.exit(1);
              }
              console.log("doctor node check ok:", node.detail);
            });
          '
  # Two files carry the released version (see scripts/versions.mjs). Both are
  # knowable on a PR, so the disagreement is caught here rather than by the release workflow after
  # the bump commit is already on main. No pnpm install and no matrix: plain Node, one platform.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - run: node scripts/versions.mjs --check
      # The check above only ever sees a tree whose versions agree, so it proves nothing about the
      # failure paths. These do: node's built-in runner (not vitest — that would need an install,
      # and it only collects packages/*) over throwaway fixture trees, never the real five files.
      - run: node --test scripts/versions.test.mjs
      # The Codex eval runner's grader adapter, which needs no install either. The eval suite itself
      # never runs in CI: it needs a personal login, and every run costs money.
      - run: node --test scripts/skill-evals/graders.test.mjs
  # Static audit of this repository's GitHub Actions setup (workflows and dependabot.yml) with
  # zizmor at its default `regular` persona: https://docs.zizmor.sh/audits/. Any finding fails the
  # job (exit codes 11-14); `--format github` turns each one into an annotation on the diff. A
  # finding that is accepted rather than fixed carries a `# zizmor: ignore[<rule>]` comment at the
  # site, with the reason, so the waiver is reviewed with the code it waives.
  #
  # Run from PyPI through uvx at an exact version, as in skill-audit.yml, rather than through
  # zizmor-action, which uploads SARIF and so needs `security-events: write` — a permission a fork
  # pull request is never granted. Dependabot does not see this pin; bump it by hand.
  #
  # GH_TOKEN enables the online audits (impostor commits behind a pinned SHA, known-vulnerable
  # actions, ref confusion). They only read public repository data, which the read-only token a
  # fork pull request gets is enough for.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: pipx install uv
      - run: uvx zizmor@1.31.1 --format github .
        env:
          GH_TOKEN: ${{ github.token }}
  bundle-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-bundle-determinism.sh
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: smoke test against a file:// fixture
        # zizmor's adhoc-packages flags the global install below. It installs the tarball this job
        # just packed from the checked-out tree — installing it the way a user does is the test.
        run: | # zizmor: ignore[adhoc-packages] installs the locally packed tarball under test
          set -euo pipefail
          npm pack ./packages/cli --pack-destination /tmp
          npm install -g /tmp/kaisers-io-refs-*.tgz
          export REFS_ALLOW_FILE_URLS=1
          export REFS_HOME="$(mktemp -d)"
          refs init --json
          FIX="$(mktemp -d)"; git -C "$FIX" init -qb main
          git -C "$FIX" -c user.email=ci@refs -c user.name=ci commit -qm init --allow-empty
          git -C "$FIX" tag v1.0.0
          refs add "file://$FIX" --description "smoke fixture" --json
          refs list --json | grep -q '"ok":true'
          refs sync --json
          refs remove "$(refs list --json | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>console.log(JSON.parse(d).data[0].key))')" --json
  # PowerShell (not bash) on purpose: this exercises the npm-generated `.cmd` shims and real
  # Windows path handling — exactly what a Windows user hits first.
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: smoke test against a file:// fixture (PowerShell)
        shell: pwsh
        run: | # zizmor: ignore[adhoc-packages] installs the locally packed tarball under test
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm pack ./packages/cli --pack-destination $env:TEMP
          npm install -g (Get-ChildItem "$env:TEMP\kaisers-io-refs-*.tgz").FullName
          $env:REFS_ALLOW_FILE_URLS = '1'
          $env:REFS_HOME = Join-Path $env:TEMP "refs-home-$([guid]::NewGuid())"
          refs init --json
          $fix = Join-Path $env:TEMP "refs-fix-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $fix | Out-Null
          git -C $fix init -qb main
          git -C $fix -c user.email=ci@refs -c user.name=ci commit -qm init --allow-empty
          git -C $fix tag v1.0.0
          $fixUrl = node -e "console.log(require('node:url').pathToFileURL(process.argv[1]).href)" $fix
          refs add $fixUrl --description "smoke fixture" --json
          if (-not (refs list --json | Select-String -Quiet '"ok":true')) { exit 1 }
          refs sync --json
          $key = refs list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).data[0].key))"
          refs remove $key --json
